<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>生日快乐！</title>
<meta name="description" content="给你的一张会动的生日贺卡">
<meta property="og:title" content="生日快乐！">
<meta property="og:description" content="点开拆礼物、吹蜡烛，还有一封信给你">
<meta name="theme-color" content="#FFE9A8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%82%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Ma+Shan+Zheng&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>
<style>
/* Layout: one narrow phone-first "stage" column. A chibi version of her stands behind a party table; one button under a speech bubble moves the story on. */
:root{
  --sun:#FFC83D;      /* her yellow T-shirt */
  --sun-deep:#E9A817;
  --ground:#FFE9A8;
  --ink:#3A1E36;
  --pink:#FF6F96;
  --sky:#7CC8F2;
  --paper:#FFFCF4;
  --muted:#7A5A6E;
  --f-display:"ZCOOL KuaiLe","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --f-body:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --f-hand:"Ma Shan Zheng","Kaiti SC","STKaiti","KaiTi",serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--ground);color:var(--ink)}
body{
  margin:0;font-family:var(--f-body);font-size:16px;line-height:1.6;
  background-color:var(--ground);
  background-image:radial-gradient(rgba(233,168,23,.28) 1.6px,transparent 1.8px);
  background-size:22px 22px;overflow-x:hidden;
}
.wrap{
  max-width:460px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px 48px;
  display:flex;flex-direction:column;align-items:center;gap:14px;
}
.kicker{margin:0;font-size:13px;letter-spacing:.18em;color:var(--muted)}
h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(34px,10vw,50px);line-height:1.15;text-align:center;text-wrap:balance;color:var(--ink)}
h1 .ch{display:inline-block}
h1.party .ch{animation:hop .9s cubic-bezier(.3,1.6,.5,1) both;color:var(--pink);text-shadow:3px 3px 0 var(--sun)}
@keyframes hop{0%{transform:translateY(30px) scale(.4);opacity:0}100%{transform:none;opacity:1}}

/* ---------- stage ---------- */
.stage{position:relative;overflow-x:clip;width:100%;max-width:420px;aspect-ratio:360/440;user-select:none;-webkit-user-select:none;touch-action:none}
.sun-disc{position:absolute;inset:3% 5% 22%;border-radius:50%;background:var(--paper);opacity:.8}
#girl{position:absolute;left:50%;bottom:2%;height:92%;aspect-ratio:543/911;max-width:100%;transform:translateX(-50%);cursor:pointer}
#girl .bob,#girl .pose{position:absolute;inset:0}
#girl .bob{animation:bob 2.8s ease-in-out infinite;transform-origin:50% 100%}
@keyframes bob{50%{transform:translateY(-1.2%) rotate(.8deg)}}
#girl.jump .bob{animation:jump .55s cubic-bezier(.3,0,.4,1) 3}
@keyframes jump{0%,100%{transform:none}40%{transform:translateY(-7%) rotate(-2deg)}}
#girl .pose{transform-origin:50% 100%}
#girl .pose.pop{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.94,1.05)}100%{transform:none}}
#girl.cheering .pose{animation:sway2 .5s ease-in-out infinite alternate}
@keyframes sway2{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg)}}
#girl img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;-webkit-user-drag:none;user-select:none}
#girl .over{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.x{opacity:0;transition:opacity .12s}
.x.on{opacity:1}
.vein.on{animation:vein .8s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes vein{to{transform:scale(1.2)}}
.twinkle path{animation:tw 1.1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
.twinkle path:nth-child(2n){animation-delay:.5s}
@keyframes tw{from{transform:scale(.4) rotate(0)}to{transform:scale(1.1) rotate(25deg)}}
.wind.on path{stroke-dasharray:22 44;animation:wind .5s linear infinite}
@keyframes wind{to{stroke-dashoffset:-66}}
.hat{transform:translateY(-320px) rotate(-30deg);opacity:0;transition:transform .7s cubic-bezier(.3,1.5,.5,1),opacity .2s}
.hat.on{transform:none;opacity:1}
.heart{position:absolute;color:var(--pink);font-size:26px;pointer-events:none;animation:float 1.4s ease-out forwards;text-shadow:0 2px 0 rgba(58,30,54,.15)}
@keyframes float{from{opacity:1;transform:translateY(0) scale(.6)}to{opacity:0;transform:translateY(-90px) scale(1.3)}}

.table{position:absolute;left:-4%;right:-4%;bottom:0;height:16%;background:var(--pink);border-radius:14px 14px 4px 4px;box-shadow:inset 0 -10px 0 rgba(0,0,0,.08)}
.table::before{content:"";position:absolute;left:0;right:0;top:100%;height:14px;background:radial-gradient(circle at 10px 0,var(--pink) 9px,transparent 10px) 0 0/20px 14px repeat-x}
.front{position:absolute;left:50%;bottom:3%;width:48%;transform:translateX(-50%)}
#gift{display:block;width:72%;margin:0 auto;cursor:pointer;overflow:visible;animation:wiggle 1.6s ease-in-out infinite;transform-origin:50% 100%;transition:filter .3s}
#gift .leak{opacity:0;transition:opacity .4s}
#gift.lv1 .leak{opacity:.35}
#gift.lv2 .leak{opacity:.7}
#gift.lv3 .leak{opacity:1}
#gift.lv1{animation:wiggle 1.1s ease-in-out infinite}
#gift.lv2{animation:shake .38s ease-in-out infinite}
@keyframes shake{0%,100%{transform:none}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
#gift.hop{animation:hop2 .48s cubic-bezier(.3,0,.4,1)}
@keyframes hop2{0%{transform:none}18%{transform:scale(1.12,.84)}45%{transform:translateY(-30%) rotate(-7deg) scale(.94,1.08)}72%{transform:translateY(0) scale(1.16,.82)}100%{transform:none}}
#gift.charge{animation:rattle .05s linear infinite alternate;filter:brightness(1.15) drop-shadow(0 0 14px rgba(255,214,90,.9))}
@keyframes rattle{from{transform:translate(-3px,1px) rotate(-3deg) scale(1.04)}to{transform:translate(3px,-1px) rotate(3deg) scale(1.08)}}
#gift.squash{animation:none;transform:scale(1.22,.7);transition:transform .1s}
@keyframes wiggle{0%,70%,100%{transform:none}76%{transform:rotate(-6deg)}82%{transform:rotate(6deg)}88%{transform:rotate(-3deg)}}
#gift .lid{transition:transform .6s cubic-bezier(.2,1.2,.4,1),opacity .6s}
#gift.open{animation:none}
#gift.open .lid{transform:translate(60px,-160px) rotate(40deg);opacity:0}
#gift.open .box{transition:opacity .4s .3s;opacity:0}
#cake{display:block;width:100%;transform:translateY(40px) scale(.8);opacity:0;transition:transform .7s cubic-bezier(.3,1.5,.5,1),opacity .3s}
#cake.on{transform:none;opacity:1}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick .18s ease-in-out infinite alternate}
.flame:nth-child(2n){animation-duration:.23s}
@keyframes flick{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(.9,1.08) rotate(3deg)}}
.flame.out{animation:none;transform:scale(0);transition:transform .25s}
.glow{transition:opacity .3s}
.rays{position:absolute;left:50%;top:70%;width:180%;aspect-ratio:1;transform:translate(-50%,-50%);pointer-events:none;opacity:0;transition:opacity .8s;
  -webkit-mask:radial-gradient(circle,#000 12%,transparent 62%);mask:radial-gradient(circle,#000 12%,transparent 62%)}
.rays.on{opacity:1}
.rays::before,.rays::after{content:"";position:absolute;inset:0;border-radius:50%}
.rays::before{background:repeating-conic-gradient(from 0deg,rgba(255,255,255,0) 0deg,rgba(255,250,225,.75) 7deg,rgba(255,255,255,0) 15deg,rgba(255,255,255,0) 30deg);animation:spin 18s linear infinite}
.rays::after{background:repeating-conic-gradient(from 10deg,rgba(255,255,255,0) 0deg,rgba(255,214,120,.45) 10deg,rgba(255,255,255,0) 22deg,rgba(255,255,255,0) 45deg);animation:spin 30s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.flash{position:absolute;left:50%;top:76%;width:150%;aspect-ratio:1;transform:translate(-50%,-50%) scale(.3);border-radius:50%;pointer-events:none;opacity:0;mix-blend-mode:screen;
  background:radial-gradient(circle,rgba(255,252,235,.95) 0,rgba(255,226,140,.55) 28%,rgba(255,200,120,0) 62%)}
.flash.go{animation:flash .75s ease-out}
@keyframes flash{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}15%{opacity:.78}100%{opacity:0;transform:translate(-50%,-50%) scale(1.5)}}
.ring{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;pointer-events:none;animation:ring .8s cubic-bezier(.2,.7,.3,1) forwards}
.ring.r1{border:10px solid rgba(255,214,90,.25)}
.ring.r2{border:5px solid rgba(255,190,120,.55);animation-delay:.05s}
.ring.r3{border:2px solid rgba(255,255,255,.95);animation-delay:.1s}
@keyframes ring{from{transform:scale(.2);opacity:1}to{transform:scale(7);opacity:0}}
.stage.shake{animation:sshake .4s cubic-bezier(.3,0,.3,1)}
@keyframes sshake{0%,100%{translate:0 0}20%{translate:-6px 3px}40%{translate:5px -4px}60%{translate:-3px 2px}80%{translate:2px -1px}}
.smoke{animation:smoke 1.4s ease-out forwards}
@keyframes smoke{from{opacity:.7;transform:translateY(0) scale(.6)}to{opacity:0;transform:translateY(-40px) scale(1.6)}}
.tag{position:absolute;top:-30px;left:50%;transform:translateX(-50%);font-family:var(--f-display);font-size:15px;background:var(--ink);color:var(--paper);padding:2px 10px;border-radius:999px;white-space:nowrap;pointer-events:none}
.tag::after{content:"";position:absolute;left:50%;top:100%;margin-left:-5px;border:5px solid transparent;border-top-color:var(--ink)}

/* ---------- bubble & controls ---------- */
.bubble{position:relative;width:100%;min-height:3.6em;background:var(--paper);border:2.5px solid var(--ink);border-radius:18px;padding:12px 16px;font-size:17px;box-shadow:4px 4px 0 var(--ink)}
.bubble::before{content:"";position:absolute;left:28%;top:-13px;width:20px;height:20px;background:var(--paper);border-left:2.5px solid var(--ink);border-top:2.5px solid var(--ink);transform:rotate(45deg)}
.bubble .who{font-family:var(--f-display);color:var(--pink);margin-right:6px}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;width:100%}
button{font:inherit;cursor:pointer}
.btn{font-family:var(--f-display);font-size:20px;color:var(--ink);background:var(--sun);border:2.5px solid var(--ink);border-radius:14px;padding:10px 22px;box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.ghost{background:var(--paper)}
#gift:focus{outline:none}
.btn:focus-visible,.sound:focus-visible,#gift:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
.hint{margin:0;font-size:13px;color:var(--muted);text-align:center}
.sound{position:fixed;z-index:20;top:calc(10px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));width:44px;height:44px;border-radius:50%;border:2.5px solid var(--ink);background:var(--paper);color:var(--ink);font-size:20px;line-height:1;box-shadow:2px 2px 0 var(--ink)}
.sound[aria-pressed="false"]{opacity:.55;text-decoration:line-through}

/* ---------- letter ---------- */
#letter{width:100%;display:flex;flex-direction:column;align-items:center;gap:18px;margin-top:10px;scroll-margin-top:20px}
.polaroid{width:min(250px,70%);margin:0;background:#fff;padding:12px 12px 10px;border-radius:4px;box-shadow:0 10px 24px rgba(58,30,54,.25);transform:rotate(-4deg);animation:drop .8s cubic-bezier(.3,1.4,.5,1) both}
.polaroid img{display:block;width:100%;max-width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:2px}
.polaroid figcaption{font-family:var(--f-hand);font-size:20px;text-align:center;color:var(--ink);padding-top:6px}
@keyframes drop{from{transform:translateY(-40px) rotate(8deg);opacity:0}}
.paper{width:100%;background:var(--paper);border-radius:6px;padding:22px 20px 26px;border:2.5px solid var(--ink);box-shadow:6px 6px 0 var(--sun-deep);
  background-image:repeating-linear-gradient(transparent 0 35px,rgba(124,200,242,.45) 35px 36px);background-position:0 14px;cursor:pointer}
.paper p{margin:0;font-family:var(--f-hand);font-size:22px;line-height:36px;white-space:pre-wrap;min-height:36px;color:var(--ink)}
.caret{display:inline-block;width:2px;height:1em;background:var(--ink);vertical-align:-3px;animation:caret 1s steps(1) infinite}
@keyframes caret{50%{opacity:0}}
/* ---------- memories ---------- */
.memories{width:100%;display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:10px;scroll-margin-top:20px}
.sec-title{margin:10px 0 0;font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.2;color:var(--ink);text-align:center}
.sec-sub{margin:-8px 0 0;font-size:13px;letter-spacing:.12em;color:var(--muted)}
.road-wrap{width:100%;border:2.5px solid var(--ink);border-radius:16px;overflow:hidden;box-shadow:4px 4px 0 var(--ink);background:#FFC98A}
#road{display:block;width:100%;height:auto;aspect-ratio:360/210}
.road-cap{margin:0;font-family:var(--f-hand);font-size:23px;line-height:1.5;min-height:1.5em;text-align:center;color:var(--ink);transition:opacity .35s}
.road-cap.fade{opacity:0}
.mem-list{list-style:none;margin:0;padding:0;width:100%;display:flex;flex-direction:column;gap:16px}
.mem{position:relative;display:flex;gap:12px;align-items:center;background:var(--paper);border:2.5px solid var(--ink);border-radius:16px;padding:10px 14px 10px 10px;box-shadow:4px 4px 0 var(--ink);cursor:pointer;transform:rotate(-1.2deg)}
.mem:nth-child(2n){transform:rotate(1deg)}
.mem.in{animation:memIn .55s cubic-bezier(.3,1.4,.5,1) both}
@keyframes memIn{from{opacity:0;translate:0 18px;scale:.92}}
.mem.wig{animation:memWig .5s ease-in-out}
@keyframes memWig{25%{rotate:-4deg;scale:1.04}60%{rotate:3deg}}
.mem svg{flex:0 0 84px;width:84px;height:84px}
.mem-media{position:relative;flex:0 0 84px;width:84px;height:84px;display:grid;place-items:center}
.mem-media img{display:block;max-width:100%;max-height:100%}
.mem:first-child .mem-media img{width:80px;height:80px;object-fit:cover;object-position:48% 46%;border-radius:50%;border:2.5px solid var(--ink)}
.mem-media.tv img{width:84px;height:84px;object-fit:cover;border-radius:12px;border:2.5px solid var(--ink)}
.mem-media.fan{flex-basis:108px;width:108px}
.fan img{position:absolute;height:76px;width:auto;max-width:none;border-radius:5px;box-shadow:2px 3px 0 rgba(58,30,54,.35)}
.fan .c1{left:0;top:4px;transform:rotate(-10deg)}
.fan .c2{left:38px;top:0;transform:rotate(8deg)}
.fan .c3{right:-6px;bottom:-4px;height:34px;border-radius:8px;transform:rotate(-8deg)}
.mem-text{min-width:0}
.mem-k{font-family:var(--f-display);font-size:21px;color:var(--ink)}
.mem-where{display:inline-block;margin-left:8px;font-size:13px;line-height:1.6;color:#fff;background:var(--pink);border-radius:999px;padding:0 9px;vertical-align:3px}
.mem p{margin:2px 0 0;font-size:15px;color:var(--muted)}
.mem .heart{font-size:22px}
.mem:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
/* ---------- opening ---------- */
.intro{width:100%;min-height:78vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;text-align:center;padding-block:24px}
.intro.out{animation:introOut .5s ease-in forwards}
@keyframes introOut{to{opacity:0;transform:translateY(-20px) scale(.97)}}
.intro-gift{width:120px;animation:wiggle 1.6s ease-in-out infinite;transform-origin:50% 100%}
.intro-text{margin:0;display:flex;flex-direction:column;gap:10px;font-family:var(--f-display);font-size:clamp(24px,7vw,32px);line-height:1.35;color:var(--ink)}
.intro-text .big{font-size:clamp(30px,9vw,42px);color:var(--pink);text-shadow:3px 3px 0 var(--sun)}
.il,.intro-go{animation:lineIn .9s cubic-bezier(.2,.9,.3,1) both;animation-delay:var(--d)}
@keyframes lineIn{from{opacity:0;transform:translateY(14px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.story{width:100%;display:flex;flex-direction:column;align-items:center;gap:14px}
.story.in{animation:lineIn .7s cubic-bezier(.2,.9,.3,1) both}
/* ---------- table-side friends ---------- */
/* phones: the two friends stand on top of the memo, one at each side */
.memo-row{position:relative;width:100%;margin-top:84px}
.side{position:absolute;bottom:100%;margin-bottom:-6px;pointer-events:none;z-index:2}
.side.cat{left:2px;width:92px}
.side.cat img{display:block;width:100%;height:auto}
.side.cards{right:6px;width:96px;aspect-ratio:1/1.05;animation:cardsBob 2.4s ease-in-out infinite}
.side.cards img{position:absolute;bottom:0;width:58%;height:auto;border-radius:5px;box-shadow:2px 3px 0 rgba(58,30,54,.35)}
.side.cards .c1{left:0;transform:rotate(-12deg);transform-origin:50% 100%}
.side.cards .c2{right:4%;transform:rotate(9deg);transform-origin:50% 100%}
.side.cards .c3{width:34%;right:-4%;bottom:-6%;border-radius:8px;transform:rotate(-8deg)}
/* wide screens: they keep you company beside the memo while you scroll */
@media (min-width:760px){
  .memo-row{display:grid;grid-template-columns:150px minmax(0,460px) 150px;gap:24px;align-items:start;width:min(820px,calc(100vw - 48px));margin-top:0}
  .side{position:sticky;top:30vh;bottom:auto;margin:0;align-self:start}
  .side.cat{grid-column:1;grid-row:1;width:140px;justify-self:end}
  .side.cards{grid-column:3;grid-row:1;width:140px}
  .memo-row .paper{grid-column:2;grid-row:1}
}
@keyframes cardsBob{50%{transform:translateY(-4%) rotate(1.5deg)}}
/* ---------- memo letter ---------- */
.paper.memo{background-image:none;padding:0 0 22px;overflow:hidden}
.memo-head{display:flex;justify-content:space-between;align-items:baseline;padding:12px 18px;background:var(--sun);border-bottom:2.5px solid var(--ink);font-family:var(--f-display);font-size:20px;color:var(--ink)}
.memo-hint{font-family:var(--f-body);font-size:12px;color:var(--muted)}
.paper.memo p{font-family:var(--f-body);font-size:17px;line-height:1.85;padding:16px 20px 0;white-space:normal}
.ml{display:block;min-height:1.85em}
.ml.gap{min-height:.9em}
.ml.hb{font-family:var(--f-display);font-size:28px;color:var(--pink);margin-bottom:4px}
.ml.ed{display:inline-block;min-height:0;margin:8px 0 6px;padding:0 10px;font-family:var(--f-display);font-size:15px;color:#fff;background:var(--ink);border-radius:999px}
.ml.quote{margin:4px 0 10px;padding:2px 0 2px 14px;border-left:4px solid #CDB9C6;color:var(--muted)}
.ml.sign{text-align:right;font-family:var(--f-hand);font-size:20px;color:var(--muted)}
.ml.love{font-family:var(--f-hand);font-size:34px;color:var(--pink);margin-top:6px}
s.strike{text-decoration:none;background:linear-gradient(var(--ink),var(--ink)) no-repeat 0 58%/100% 2px}
i.caret{display:inline-block;width:2px;height:1em;background:var(--ink);vertical-align:-3px;margin-left:1px;animation:caret 1s steps(1) infinite}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:15}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

<button class="sound" id="sound" aria-pressed="true" aria-label="音乐开关">♪</button>
<canvas id="fx"></canvas>

<main class="wrap">
  <section class="intro" id="intro">
    <svg class="intro-gift" viewBox="0 0 200 180" aria-hidden="true">
      <rect x="28" y="74" width="144" height="100" rx="8" fill="#7CC8F2" stroke="#3A1E36" stroke-width="5"/>
      <rect x="88" y="74" width="24" height="100" fill="#FF6F96" stroke="#3A1E36" stroke-width="5"/>
      <path d="M100 52C80 22 52 26 62 46C70 58 92 54 100 52ZM100 52C120 22 148 26 138 46C130 58 108 54 100 52Z" fill="#FF6F96" stroke="#3A1E36" stroke-width="5"/>
      <rect x="18" y="50" width="164" height="30" rx="8" fill="#7CC8F2" stroke="#3A1E36" stroke-width="5"/>
      <rect x="88" y="50" width="24" height="30" fill="#FF6F96" stroke="#3A1E36" stroke-width="5"/>
    </svg>
    <p class="intro-text">
      <span class="il" style="--d:.3s">我女朋友出生的时候，</span>

    burst(160, stageY()); setTimeout(() => burst(120, stageY() - 80), 500);
    bgmSwell();
    speak("许了一个超级大的愿望！不告诉你～");
    $("#hint").textContent = "戳一戳她的脸试试";
    setActions([["拆开生日信", openLetter], ["再放一次烟花", () => { burst(140, stageY()); blip(988); }, true]]);
    setTimeout(() => { if (mood === "cheer") setMood("happy"); }, 4200);
  }

  let letterTimer;
  const esc = s => s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
  function memoHTML(text, caret){
    const lines = text.split("\n"), full = LETTER.split("\n");
    return lines.map((ln, i) => {
      const whole = full[i] || "";
      let cls = "ml";
      if (/^[二三四]编$/.test(whole)) cls += " ed";
      else if (whole.startsWith("记于")) cls += " sign";
      else if (whole.startsWith("再见了，金融街")) cls += " quote";
      else if (i === full.length - 1) cls += " love";
      else if (i === 0) cls += " hb";
      else if (!whole) cls += " gap";
      let body = esc(ln);
      if (whole.includes("渣男") && ln === whole) body = body.replace(/^(.*渣男)/, '<s class="strike">$1</s>');
      return `<span class="${cls}">${body}${caret && i === lines.length - 1 ? '<i class="caret"></i>' : ""}</span>`;
    }).join("");
  }
  function finishLetter(){ clearInterval(letterTimer); $("#letterText").innerHTML = memoHTML(LETTER, false); }
  function openLetter(){
    const sec = $("#letter"); sec.hidden = false; setActions([]);
    sec.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" });
    const p = $("#letterText"); clearInterval(letterTimer);
    if (reduce){ finishLetter(); return; }
    const chars = [...LETTER]; let i = 0; p.innerHTML = "";
    letterTimer = setInterval(() => {
      i = Math.min(chars.length, i + 1);
      p.innerHTML = memoHTML(chars.slice(0, i).join(""), true);
      if (i >= chars.length){ clearInterval(letterTimer); finishLetter(); }
    }, 55);
  }
  $("#paper").addEventListener("click", finishLetter);
  gift.addEventListener("click", tapGift);
  gift.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); tapGift(); } });
  $("#replay").onclick = () => { clearInterval(letterTimer); scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" }); start(); };

  $("#introGo").onclick = () => {
    ctx(); if (soundOn){ const t0 = ctx().currentTime; [72,76,79].forEach((n, i) => note(mid(n), t0 + i * .09, .6, .14)); }
    const intro = $("#intro"), story = $("#story");
    const show = () => { intro.hidden = true; story.hidden = false; story.classList.add("in"); scrollTo(0, 0); start(); };
    if (reduce) show(); else { intro.classList.add("out"); setTimeout(show, 480); }
  };
  start();
})();
</script>
</body>
</html>
